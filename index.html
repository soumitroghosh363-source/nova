<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="preload"
      href="/node_modules/@fontsource/manrope/files/manrope-latin-800-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- Title & description -->
    <title>NOVA — Objects for Everyday Living</title>
    <meta
      name="description"
      content="A curated collection of considered objects for everyday life. Discover NOVA's edit of audio, workspace, and home essentials."
    />
    <meta name="theme-color" content="#C1441E" />

    <!-- Open Graph (link previews on social/messaging apps) -->
    <meta property="og:title" content="NOVA — Objects for Everyday Living" />
    <meta
      property="og:description"
      content="A curated collection of considered objects for everyday life."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NOVA — Objects for Everyday Living" />
    <meta
      name="twitter:description"
      content="A curated collection of considered objects for everyday life."
    />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
